<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Stillbloom Marketing Tool</title>
    <style>
        /* Center everything */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Style the result box */
        .result-box {
            width: 80%;
            max-width: 600px;
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            background-color: #d6d6d6;
            white-space: pre-wrap; /* Preserve formatting */
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <h1>Stillbloom Marketing Tool</h1>

        <div class="m-5">
            <h6><b>Total Embeddings : {{total_docs}}</b></h6>
        </div>

        <!-- Form to submit query -->
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="query" class="form-label"><strong>Write a Query</strong></label>
                <label for="query" class="form-label"></label>
                
                <input type="text" class="form-control" id="query" name="query" required>
                <span class="form-text text-sm">E.g. Create an anti-aging skincare ad</span>
            </div>
            <button type="submit" class="btn btn-primary">Get Script</button>
        </form>

        <!-- Display result below -->
        <div class="result-box mt-4">
            {{ result|default:"Results will be displayed here..."|safe }}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
        crossorigin="anonymous"></script>

</body>
</html>
